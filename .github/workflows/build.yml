name: React CI/CD for Test
on:
  push:
    branches:
      - development
      - main
      - "feature/*"
      - "bug/*"
      - "hotfix/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: Style Lint Check
        run: npm run stylelint

      - name: Prettier Check
        run: npm run prettier:check

      - name: Build Check
        run: npm run build
